[project]
name = "gitmap"
version = "0.1.0"
description = "Turn a project roadmap into a structured GitHub project."
requires-python = ">=3.11"
dependencies = [
    "PyGithub",
    "rich",
]

[project.scripts]
gitmap = "gitmap.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]